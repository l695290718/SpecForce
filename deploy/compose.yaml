services:
  # The native scanner remains an operator-side binary. It reaches SpecForge only
  # through an authorized Agent/MCP client and is intentionally not a Compose service.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
    volumes:
      - specforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}?schema=public
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      SPECFORGE_3A_CURSOR_KEYS: ${SPECFORGE_3A_CURSOR_KEYS:?Set SPECFORGE_3A_CURSOR_KEYS in deploy/.env}
      SPECFORGE_3A_CURSOR_ACTIVE_KEY_ID: ${SPECFORGE_3A_CURSOR_ACTIVE_KEY_ID:?Set SPECFORGE_3A_CURSOR_ACTIVE_KEY_ID in deploy/.env}
      SPECFORGE_WEB_AUTH_MODE: ${SPECFORGE_WEB_AUTH_MODE:-static}
      SPECFORGE_WEB_PRINCIPAL_CLAIMS: ${SPECFORGE_WEB_PRINCIPAL_CLAIMS:-}
      SPECFORGE_IDENTITY_MODE: ${SPECFORGE_IDENTITY_MODE:-development}
      SPECFORGE_IDENTITY_SECRET_PEPPER: ${SPECFORGE_IDENTITY_SECRET_PEPPER:-}
      SPECFORGE_WEB_ORIGIN: ${SPECFORGE_WEB_ORIGIN:-http://localhost:3010}
      SPECFORGE_TENANT_ID: ${SPECFORGE_TENANT_ID:-local-enterprise}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      three-a-bootstrap:
        condition: service_completed_successfully
    ports:
      - "${SPECFORGE_WEB_PORT:-3010}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  knowledge-projector:
    build:
      context: ..
      dockerfile: deploy/knowledge-projector.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}?schema=public
      SPECFORGE_KNOWLEDGE_PROJECTOR_HOST: 0.0.0.0
      SPECFORGE_KNOWLEDGE_PROJECTOR_PORT: "8091"
      SPECFORGE_KNOWLEDGE_PROJECTOR_LEASE_MS: ${SPECFORGE_KNOWLEDGE_PROJECTOR_LEASE_MS:-300000}
      SPECFORGE_PROJECTOR_HEALTH_APPLICATION_SERVICE_ID: ${SPECFORGE_PROJECTOR_HEALTH_APPLICATION_SERVICE_ID:-com.huawei.celon.desiner}
      SPECFORGE_PROJECTOR_HEALTH_SCOPE_PATH: ${SPECFORGE_PROJECTOR_HEALTH_SCOPE_PATH:-pf-huawei/product-celon/subproduct-platform/module-celon-designer/com.huawei.celon.desiner}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require('node:http');
          const query=new URLSearchParams({applicationServiceId:process.env.SPECFORGE_PROJECTOR_HEALTH_APPLICATION_SERVICE_ID,scopePath:process.env.SPECFORGE_PROJECTOR_HEALTH_SCOPE_PATH}).toString();
          http.get('http://127.0.0.1:8091/health?'+query,response=>process.exit(response.statusCode===200?0:1)).on('error',()=>process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  connector-worker:
    build:
      context: ..
      dockerfile: deploy/connector-worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}?schema=public
      SPECFORGE_CONNECTOR_WORKER_APPLICATION_SERVICE_ID: ${SPECFORGE_CONNECTOR_WORKER_APPLICATION_SERVICE_ID:-com.huawei.celon.desiner}
      SPECFORGE_CONNECTOR_WORKER_SCOPE_PATH: ${SPECFORGE_CONNECTOR_WORKER_SCOPE_PATH:-pf-huawei/product-celon/subproduct-platform/module-celon-designer/com.huawei.celon.desiner}
      SPECFORGE_CONNECTOR_WORKER_INTERVAL_MS: ${SPECFORGE_CONNECTOR_WORKER_INTERVAL_MS:-5000}
      SPECFORGE_CONNECTOR_WORKER_BATCH_LIMIT: ${SPECFORGE_CONNECTOR_WORKER_BATCH_LIMIT:-10}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8092/healthz', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  requirement-assessment-worker:
    build:
      context: ..
      dockerfile: deploy/requirement-assessment-worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}?schema=public
      SPECFORGE_ENTERPRISE_ID: ${SPECFORGE_ENTERPRISE_ID:-legacy-enterprise}
      SPECFORGE_ASSESSMENT_WORKER_APPLICATION_SERVICE_ID: ${SPECFORGE_ASSESSMENT_WORKER_APPLICATION_SERVICE_ID:-com.huawei.celon.desiner}
      SPECFORGE_ASSESSMENT_WORKER_SCOPE_PATH: ${SPECFORGE_ASSESSMENT_WORKER_SCOPE_PATH:-pf-huawei/product-celon/subproduct-platform/module-celon-designer/com.huawei.celon.desiner}
      SPECFORGE_ASSESSMENT_WORKER_INTERVAL_MS: ${SPECFORGE_ASSESSMENT_WORKER_INTERVAL_MS:-5000}
      SPECFORGE_ASSESSMENT_WORKER_BATCH_LIMIT: ${SPECFORGE_ASSESSMENT_WORKER_BATCH_LIMIT:-5}
      SPECFORGE_ASSESSMENT_RECONCILIATION_STATUS: ${SPECFORGE_ASSESSMENT_RECONCILIATION_STATUS:-UNVERIFIED}
      SPECFORGE_ASSESSMENT_PROJECTION_CHECKPOINT: ${SPECFORGE_ASSESSMENT_PROJECTION_CHECKPOINT:-}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8093/healthz', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  bootstrap:
    build:
      context: ..
      dockerfile: deploy/bootstrap.Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}?schema=public
      SPECFORGE_BOOTSTRAP_VERSION: ${SPECFORGE_BOOTSTRAP_VERSION:-2026-08-12.v1}
      SPECFORGE_BOOTSTRAP_ADOPT_EXISTING: ${SPECFORGE_BOOTSTRAP_ADOPT_EXISTING:-0}
    depends_on:
      postgres:
        condition: service_healthy

  three-a-bootstrap:
    build:
      context: ..
      dockerfile: deploy/three-a-bootstrap.Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}?schema=public
      SPECFORGE_ENTERPRISE_ID: ${SPECFORGE_ENTERPRISE_ID:-legacy-enterprise}
      SPECFORGE_3A_BOOTSTRAP_POLL_INTERVAL_MS: ${SPECFORGE_3A_BOOTSTRAP_POLL_INTERVAL_MS:-1000}
      SPECFORGE_3A_BOOTSTRAP_TIMEOUT_MS: ${SPECFORGE_3A_BOOTSTRAP_TIMEOUT_MS:-300000}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      knowledge-projector:
        condition: service_healthy

volumes:
  specforge_pgdata:
